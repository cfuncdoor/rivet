name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        cxx: [msvc, gcc, clang]
        exclude:
          - os: ubuntu-latest
            cxx: msvc
          - os: windows-latest
            cxx: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install C++ toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake
      - name: Rust fmt check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
        env:
          RIVET_TEST_NETWORK: 1
      - name: acceptance (examples corpus)
        run: |
          cargo build --locked
          ./target/debug/rivet build
          ./target/debug/rivet run
        working-directory: examples/hello
      - name: acceptance (lib+bin corpus)
        run: |
          ../../target/debug/rivet build
          ../../target/debug/rivet test
          ../../target/debug/rivet run
        working-directory: examples/libhello
      - name: acceptance (workspace corpus)
        run: |
          ../../target/debug/rivet build
          ../../target/debug/rivet run -p hello
        working-directory: examples/workspace
      - name: acceptance (features corpus)
        run: |
          ../../../target/debug/rivet build
          ../../../target/debug/rivet build --features extra
          ../../../target/debug/rivet build --all-features
          ../../../target/debug/rivet build --no-default-features
          ../../../target/debug/rivet run
          ../../../target/debug/rivet compile-commands
        working-directory: examples/features/app
      - name: acceptance (cmake corpus)
        run: |
          ../../target/debug/rivet build
          ../../target/debug/rivet run
        working-directory: examples/cmake-mini
      - name: acceptance (cmake+zlib corpus)
        run: |
          ../../target/debug/rivet build
          ../../target/debug/rivet run
        working-directory: examples/cmake-zlib
      - name: acceptance (buildscript corpus)
        run: |
          ../../target/debug/rivet build
          ../../target/debug/rivet run
        working-directory: examples/buildscript-demo
