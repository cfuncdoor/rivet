name: release

# Every commit to main republishes rolling binaries under the `latest`
# tag (a pre-release), so install.sh / install.ps1 always have something
# to download via .../releases/download/latest/.... Pushing a `v*` tag
# publishes a versioned (stable) release instead (which then also answers
# .../releases/latest/download/...).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: rivet-x86_64-unknown-linux-musl.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rivet-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl
          stage="$(mktemp -d)"
          cp target/x86_64-unknown-linux-musl/release/rivet "$stage/rivet"
          chmod +x "$stage/rivet"
          tar -czf rivet-x86_64-unknown-linux-musl.tar.gz -C "$stage" rivet
          sha256sum rivet-x86_64-unknown-linux-musl.tar.gz > rivet-x86_64-unknown-linux-musl.tar.gz.sha256
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Path stage -Force | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\rivet.exe stage\rivet.exe -Force
          Compress-Archive -Path stage\rivet.exe -DestinationPath rivet-x86_64-pc-windows-msvc.zip -Force
          ((Get-FileHash rivet-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash.ToLower() + "  rivet-x86_64-pc-windows-msvc.zip") | Set-Content rivet-x86_64-pc-windows-msvc.zip.sha256
      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    name: publish to Releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: List assets
        shell: bash
        run: ls -la dist
      - name: Resolve tag
        id: vars
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=latest (${GITHUB_SHA:0:7})" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          prerelease: ${{ steps.vars.outputs.prerelease }}
          generate_release_notes: true
          make_latest: ${{ steps.vars.outputs.prerelease != 'true' }}
          body: |
            Auto-built from commit ${{ github.sha }} on ${{ github.ref_name }}.

            Install (Linux):
            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            Install (Windows):
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```
          files: |
            dist/rivet-x86_64-unknown-linux-musl.tar.gz
            dist/rivet-x86_64-unknown-linux-musl.tar.gz.sha256
            dist/rivet-x86_64-pc-windows-msvc.zip
            dist/rivet-x86_64-pc-windows-msvc.zip.sha256
