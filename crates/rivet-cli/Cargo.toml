[package]
name = "rivet-cli"
version = "0.1.0"
edition = "2021"
description = "rivet command-line interface"
license = "MIT OR Apache-2.0"
rust-version = "1.74"

[dependencies]
rivet-manifest = { path = "../rivet-manifest" }
rivet-toolchain = { path = "../rivet-toolchain" }
rivet-graph = { path = "../rivet-graph" }
rivet-git = { path = "../rivet-git" }
rivet-resolver = { path = "../rivet-resolver" }
rivet-cache = { path = "../rivet-cache" }
rivet-registry = { path = "../rivet-registry" }
rivet-adapters = { path = "../rivet-adapters" }
rivet-buildscript = { path = "../rivet-buildscript" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "color"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"
