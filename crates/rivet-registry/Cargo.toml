[package]
name = "rivet-registry"
version = "0.1.0"
edition = "2021"
description = "Package registry index, fetch, and publish"
license = "MIT OR Apache-2.0"
rust-version = "1.74"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
tar = "0.4"
flate2 = "1.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.0"
