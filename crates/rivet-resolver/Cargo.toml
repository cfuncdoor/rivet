[package]
name = "rivet-resolver"
version = "0.1.0"
edition = "2021"
description = "SemVer resolution producing rivet.lock.json"
license = "MIT OR Apache-2.0"
rust-version = "1.74"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
rivet-manifest = { path = "../rivet-manifest" }
rivet-git = { path = "../rivet-git" }

[dev-dependencies]
tempfile = "3.0"
