[package]
name = "rivet-toolchain"
version = "0.1.0"
edition = "2021"
description = "C/C++ toolchain detection (MSVC, clang, gcc, clang-cl, MinGW)"
license = "MIT OR Apache-2.0"
rust-version = "1.74"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
which = "7.0"

[dev-dependencies]
tempfile = "3.0"
